<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Show</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans', sans-serif; background:#b3cde0; margin:0; padding:20px; text-align:center; }
    .panel { background:rgba(255,255,255,0.9); padding:16px; border-radius:10px; margin:12px auto; max-width:800px; }
    button { margin:6px; padding:10px 16px; border:none; border-radius:8px; cursor:pointer; }
    .btn.red { background:crimson; color:white; }
    .btn.green { background:seagreen; color:white; }
    .progress { height:20px; background:#eee; border-radius:10px; overflow:hidden; margin-top:6px; }
    .bar { height:100%; background:#4682b4; width:0%; color:white; font-size:12px; text-align:right; padding-right:6px; line-height:20px; }
    #history { position:fixed; bottom:10px; right:10px; width:340px; height:220px; overflow-y:auto; background:rgba(255,255,255,0.9); border:1px solid #333; border-radius:10px; padding:10px; text-align:left; }
    #result { font-weight:bold; font-size:22px; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Game Show: Red vs Green</h1>

  <!-- Lobby -->
  <div class="panel" id="lobby">
    <button onclick="createGame()">Create Game</button>
    <input id="joinId" placeholder="Enter room code">
    <button onclick="joinGame()">Join Game</button>
    <button onclick="loadLobby()">Refresh Lobby</button>
    <div id="gameList"></div>
  </div>

  <!-- Player view -->
  <div class="panel" id="playerView" style="display:none;">
    <select id="role"><option value="A">Player A</option><option value="B">Player B</option></select>
    <input id="name" placeholder="Your name">
    <button onclick="setName()">Set Name</button>
    <div>
      <button class="btn red" onclick="sendChoice('red')">Red</button>
      <button class="btn green" onclick="sendChoice('green')">Green</button>
    </div>
    <div id="scoreboard">
      <p>Round: <span id="round">1</span>/30</p>
      <p><span id="labelA">Player A</span>: <span id="scoreA">0</span></p>
      <div class="progress"><div id="barA" class="bar">0%</div></div>
      <p><span id="labelB">Player B</span>: <span id="scoreB">0</span></p>
      <div class="progress"><div id="barB" class="bar">0%</div></div>
      <div id="result"></div>
    </div>
    <button onclick="replay()">Replay</button>
    <button onclick="reset()">Reset</button>
  </div>

  <!-- Spectator view -->
  <div class="panel" id="spectatorView" style="display:none;">
    <h2>Spectator Mode</h2>
    <div id="spectatorBoard"></div>
  </div>

  <div id="history"><h3>History</h3><div id="historyList"></div></div>

  <script>
    // ===== Configuration =====
    const API = "https://your-server.onrender.com"; // replace with your deployed server base URL
    const POLL_MS = 2000;
    const MAX_SCORE = 150;

    // ===== Runtime state =====
    let gameId = null;
    let myRole = "A";
    let pollTimer = null;
    let spectating = false;

    // ===== DOM refs =====
    const refs = {
      lobby: document.getElementById('lobby'),
      playerView: document.getElementById('playerView'),
      spectatorView: document.getElementById('spectatorView'),
      gameList: document.getElementById('gameList'),
      joinId: document.getElementById('joinId'),
      role: document.getElementById('role'),
      name: document.getElementById('name'),
      labelA: document.getElementById('labelA'),
      labelB: document.getElementById('labelB'),
      scoreA: document.getElementById('scoreA'),
      scoreB: document.getElementById('scoreB'),
      barA: document.getElementById('barA'),
      barB: document.getElementById('barB'),
      round: document.getElementById('round'),
      result: document.getElementById('result'),
      historyList: document.getElementById('historyList'),
      spectatorBoard: document.getElementById('spectatorBoard')
    };

    // ===== Lobby actions =====
    async function createGame() {
      const res = await fetch(API + "/create", { method: "POST" });
      const data = await res.json();
      gameId = data.gameId;
      alert("Game created! Share this room code: " + gameId);
      enterPlayerView();
    }

    async function joinGame() {
      const id = refs.joinId.value.trim();
      if (!id) return alert("Enter a room code to join.");
      gameId = id;
      enterPlayerView();
    }

    async function loadLobby() {
      const res = await fetch(API + "/games");
      const list = await res.json();
      refs.gameList.innerHTML = list.map(g => `
        <div style="margin:6px 0; display:flex; gap:8px; align-items:center; justify-content:center;">
          <code>${g.id}</code> — ${escapeHtml(g.names.A)} vs ${escapeHtml(g.names.B)}, Round ${g.round} ${g.finished ? '(Finished)' : ''}
          <button onclick="watchGame('${g.id}')">Watch</button>
          <button onclick="joinExisting('${g.id}')">Join</button>
        </div>
      `).join('');
    }

    function joinExisting(id) {
      gameId = id;
      enterPlayerView();
    }

    // ===== Modes =====
    function enterPlayerView() {
      spectating = false;
      refs.lobby.style.display = 'none';
      refs.playerView.style.display = 'block';
      refs.spectatorView.style.display = 'none';
      startPolling();
    }

    function enterSpectatorView() {
      spectating = true;
      refs.lobby.style.display = 'none';
      refs.playerView.style.display = 'none';
      refs.spectatorView.style.display = 'block';
      startPolling(true);
    }

    async function watchGame(id) {
      gameId = id;
      enterSpectatorView();
    }

    // ===== Player actions =====
    async function setName() {
      myRole = refs.role.value;
      const name = refs.name.value.trim();
      if (!gameId) return alert("Join or create a game first.");
      await fetch(`${API}/setName/${gameId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: myRole, name })
      });
      await refresh();
    }

    async function sendChoice(color) {
      if (!gameId) return alert("Join or create a game first.");
      await fetch(`${API}/choice/${gameId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: myRole, color })
      });
      await refresh();
    }

    async function replay() {
      if (!gameId) return;
      await fetch(`${API}/replay/${gameId}`, { method: "POST" });
      await refresh();
    }

    async function reset() {
      if (!gameId) return;
      await fetch(`${API}/reset/${gameId}`, { method: "POST" });
      await refresh();
    }

    // ===== Polling =====
    function startPolling(spectate = false) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(refresh, POLL_MS);
      refresh(); // immediate
    }

    async function refresh() {
      if (!gameId) return;
      const endpoint = spectating ? `/spectate/${gameId}` : `/state/${gameId}`;
      const res = await fetch(API + endpoint);
      if (!res.ok) return;
      const state = await res.json();
      renderState(state);
    }

    // ===== Rendering =====
    function renderState(state) {
      // Scores, names, round
      refs.labelA.textContent = state.names.A;
      refs.labelB.textContent = state.names.B;
      refs.scoreA.textContent = state.scoreA;
      refs.scoreB.textContent = state.scoreB;
      refs.round.textContent = Math.min(state.round, 30);

      // Progress bars
      const pctA = Math.min(100, (state.scoreA / MAX_SCORE) * 100);
      const pctB = Math.min(100, (state.scoreB / MAX_SCORE) * 100);
      refs.barA.style.width = pctA + '%';
      refs.barB.style.width = pctB + '%';
      refs.barA.textContent = Math.round(pctA) + '%';
      refs.barB.textContent = Math.round(pctB) + '%';

      // Result message
      refs.result.textContent = state.message || '';

      // History
      refs.historyList.innerHTML = state.history.map(item => `
        <div>
          Round ${item.round}: ${escapeHtml(state.names.A)} chose ${escapeHtml(item.aChoice)}, 
          ${escapeHtml(state.names.B)} chose ${escapeHtml(item.bChoice)} 
          → ${escapeHtml(state.names.A)}: ${item.scoreA}, ${escapeHtml(state.names.B)}: ${item.scoreB}
        </div>
      `).join('');
      const historyPanel = document.getElementById('history');
      historyPanel.scrollTop = historyPanel.scrollHeight;

      // Spectator board (large view text)
      if (spectating) {
        refs.spectatorBoard.innerHTML = `
          <div style="font-size:20px; margin-bottom:10px;">
            Round ${Math.min(state.round, 30)} / 30
          </div>
          <div style="display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center;">
            <div style="text-align:left; font-weight:bold;">${escapeHtml(state.names.A)}</div>
            <div>${state.scoreA}</div>
          </div>
          <div class="progress"><div class="bar" style="width:${pctA}%; text-align:right; padding-right:6px;">${Math.round(pctA)}%</div></div>
          <div style="height:8px;"></div>
          <div style="display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center;">
            <div style="text-align:left; font-weight:bold;">${escapeHtml(state.names.B)}</div>
            <div>${state.scoreB}</div>
          </div>
          <div class="progress"><div class="bar" style="width:${pctB}%; text-align:right; padding-right:6px;">${Math.round(pctB)}%</div></div>
          <div id="resultSpectator" style="font-weight:bold; font-size:22px; margin-top:12px;">${escapeHtml(state.message || '')}</div>
        `;
      }
    }

    // ===== Utilities =====
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial lobby load
    loadLobby();
  </script>
</body>
</html>
